<header>
  <div class="bar">
    <a class="logo" routerLink="/">Bon<span>Appetit</span></a>
    <form class="search" role="search" (submit)="$event.preventDefault()">
      <svg
        aria-hidden="true"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <label for="q" class="sr-only">Search your recipes</label>
      <input
        #q
        id="q"
        type="search"
        placeholder="Search your recipes by name"
        [value]="query()"
        (input)="typed.next(q.value)"
      />
    </form>
    <a class="new" routerLink="/recipes/new">
      <svg
        aria-hidden="true"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
      >
        <path d="M12 5v14M5 12h14"></path>
      </svg>
      <span class="new-label">New recipe</span>
    </a>
    <a class="account" routerLink="/account" aria-label="Account">{{ initial() }}</a>
  </div>
</header>
