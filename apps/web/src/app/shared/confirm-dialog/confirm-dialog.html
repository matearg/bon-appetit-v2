<dialog
  #dialog
  class="confirm"
  aria-labelledby="confirm-title"
  aria-describedby="confirm-message"
  (cancel)="finish(false)"
>
  <h2 id="confirm-title" class="confirm-title">{{ opts().title }}</h2>
  <p id="confirm-message" class="confirm-message">{{ opts().message }}</p>
  <div class="confirm-actions">
    <button type="button" class="submit confirm-cancel" autofocus (click)="finish(false)">
      Cancel
    </button>
    <button type="button" class="submit" [class.danger]="opts().danger" (click)="finish(true)">
      {{ opts().confirmLabel }}
    </button>
  </div>
</dialog>
