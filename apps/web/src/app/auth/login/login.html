<main class="auth">
  <p class="brand">Bon<span>Appetit</span></p>
  <h1 class="headline">Your recipes,<br />all in one place.</h1>
  <p class="lead">Log in to open your cookbook.</p>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="row">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        class="field"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        formControlName="email"
        [attr.aria-invalid]="!!fieldError('email')"
        [attr.aria-describedby]="fieldError('email') ? 'login-email-error' : null"
      />
      @if (fieldError('email'); as msg) {
      <p id="login-email-error" class="field-error">{{ msg }}</p>
      }
    </div>
    <div class="row">
      <label for="login-password">Password</label>
      <input
        id="login-password"
        class="field"
        type="password"
        autocomplete="current-password"
        formControlName="password"
        [attr.aria-invalid]="!!fieldError('password')"
        [attr.aria-describedby]="fieldError('password') ? 'login-password-error' : null"
      />
      @if (fieldError('password'); as msg) {
      <p id="login-password-error" class="field-error">{{ msg }}</p>
      }
    </div>
    <p class="message error" role="status" aria-live="polite">{{ error() }}</p>
    <button class="submit" type="submit" [disabled]="busy()">Log in</button>
  </form>

  <p class="switch">New here? <a class="link" routerLink="/signup">Create an account</a></p>
</main>
