<a [routerLink]="['/recipes', recipe().id]">
  <div class="photo" [style.background]="tone()">
    @if (recipe().hasPhoto) {
    <img [src]="photo()" alt="" loading="lazy" />
    } @else {
    <svg
      aria-hidden="true"
      width="40"
      height="40"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <circle cx="9" cy="10" r="1.6" />
      <path d="M21 16l-5-5-8 8" />
    </svg>
    }
  </div>
  <div class="body">
    <h2>{{ recipe().title }}</h2>
    <p>{{ meta() }}</p>
  </div>
</a>
<button
  type="button"
  [attr.aria-pressed]="recipe().isFavorite"
  [attr.aria-label]="recipe().isFavorite ? 'Remove from Favorites' : 'Add to Favorites'"
  (click)="toggleFavorite.emit()"
>
  <svg
    aria-hidden="true"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    [attr.fill]="recipe().isFavorite ? 'currentColor' : 'none'"
    stroke="currentColor"
    stroke-width="2"
    stroke-linejoin="round"
  >
    <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" />
  </svg>
</button>
